app:
  name: "Grade Change Intelligence System"
  env: "development" # development, staging, production
  debug: true

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  file_path: "logs/app.log"
  rotation: "10 MB"
  retention: "1 week"

data:
  raw_sensor_path: "data/raw/sensor_readings_sample.csv"
  processed_features_path: "data/processed/engineered_features_sample.csv"
  grade_spec_path: "data/external/grade_specifications.json"

pipeline:
  rolling_window_seconds: 300
  sampling_rate_hz: 1.0
  outlier_threshold_sigma: 3.0

model:
  name: "grade_transition_rf_v1"
  version: "1.0.0"
  hyperparameters:
    n_estimators: 100
    max_depth: 10
    random_state: 42

recommendation:
  gains:
    stock_flow_per_gsm_dev: -5.5
    filler_flow_per_gsm_dev: -2.0
    steam_pressure_per_moisture_dev: 0.4
    speed_adjustment_gain: 0.05
  limits:
    max_stock_flow_change_pct: 10.0
    max_filler_flow_change_pct: 15.0
    max_steam_pressure_change_bar: 1.5
    max_speed_change_mpm: 50.0
  historical_match:
    top_k: 3
    similarity_threshold: 0.8

